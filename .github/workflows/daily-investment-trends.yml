name: Daily Investment Trends

on:
  schedule:
    # 10:07 UTC = 7:07 AM America/Sao_Paulo (BRT, UTC-3). Off the round minute
    # on purpose, to avoid GitHub Actions scheduler congestion at :00.
    - cron: "7 10 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" trigger for testing

jobs:
  send-investment-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run investment trends agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python investment_trends.py
